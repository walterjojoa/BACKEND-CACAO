server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: ritech-exports
  datasource:
    # La base se crea con database/db_ritech_exports.sql (MySQL 8.0.16+).
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_ritech_exports?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=LOCAL&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    # El esquema lo define el script SQL (triggers, procedimientos, CHECK).
    # Hibernate nunca lo crea ni lo modifica.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  jackson:
    default-property-inclusion: non_null
    time-zone: America/Bogota
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

ritech:
  jwt:
    # En produccion se fija con la variable JWT_SECRET (minimo 32 caracteres).
    secret: ${JWT_SECRET:}
    horas-validez: ${JWT_HORAS:8}
  cors:
    origenes: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  almacenamiento:
    directorio: ${STORAGE_DIR:./storage}
  semilla:
    # Si se define, reemplaza los password_hash marcadores del script por esta clave.
    password-inicial: ${SEED_PASSWORD:}
  certificados:
    dias-alerta: 30
  # Exportador que se imprime en la factura, la lista de empaque y la DDS EUDR.
  empresa:
    razon-social: ${EMPRESA_RAZON_SOCIAL:RiTech SAS}
    nit: ${EMPRESA_NIT:}
    direccion: ${EMPRESA_DIRECCION:}
    ciudad: ${EMPRESA_CIUDAD:}
    pais: ${EMPRESA_PAIS:Colombia}
    email: ${EMPRESA_EMAIL:}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs
